services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mangahour
      POSTGRES_USER: mangahour
      POSTGRES_PASSWORD: mangahour
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangahour -d mangahour"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://mangahour:mangahour@db:5432/mangahour
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    environment: *backend_environment
    command: ["python", "-m", "app.worker"]
    profiles: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
